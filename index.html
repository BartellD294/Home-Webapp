<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>Home Control</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="icon" href="assets/images/remote-controller-icon.png">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="remote">
            <div class="power-buttons">
                <button class="remote-buttons power-button" id="poweron" style="background-color: #06822b;"><strong>&#9211</strong></button>
                <button class="remote-buttons power-button" id="poweroff" style="background-color: #d90429;"><strong>&#9211</strong></button>
            </div>
            <div class="volume-buttons">
                <button class="remote-buttons" id="volumedown">&#128265;</button>
                <button class="remote-buttons" id="volumeup">&#128266;</button>
            </div>
            <div class="home-back-buttons">
                <button class="remote-buttons" id="back">&#10550;</button>
                <button class="remote-buttons" id="home">⌂</button>
            </div>  
            <div class="up-button">
                <button class="remote-buttons" id="up">&#9650;</button>
            </div>
            <div class="center-buttons">
                <button class="remote-buttons" id="left">&#9664;</button>
                <button class="remote-buttons" id="select">OK</button>
                <button class="remote-buttons" id="right">&#9654;</button>
            </div>
            <div class="down-button">
                    <button class="remote-buttons" id="down">&#9660;</button>
            </div>
            <div class="keyboard-row">
                <input id="keyboard-input" type="text" placeholder="Type here...">
                <button id="keyboard-clear">Clear</button>
            </div>
            <div class="scan-row">
                <input id="subnet-start" type="text" placeholder="Subnet start (e.g. 192.168.0)">
                <span>.</span>
                <input id="low-ip" type="number" placeholder="Low IP (e.g. 1)" min="0" max="255">
                <span>-</span>
                <input id="high-ip" type="number" placeholder="High IP (e.g. 254)" min="0" max="255">
                <button id="scan-button">Scan for devices</button>
            </div> 
        </div>
        <footer>
            <p>Icons by <a href="https://www.icons8.com/">Icons8</a></p>
        </footer>
    </body>

</html>
