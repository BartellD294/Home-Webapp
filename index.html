<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>Home Control</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="icon" href="assets/images/remote-controller-icon.png">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <div class="pane">
                <h1>Home Control</h1>
                <p>Use the remote to control your devices and the scanner to find them on your network.</p>
            </div>
            <div class="pane">
                <div class="two-row-buttons">
                    <button class="remote-buttons" id="PowerOn" style="background-color: #06822b;"><strong>&#9211</strong></button>
                    <button class="remote-buttons" id="PowerOff" style="background-color: #d90429;"><strong>&#9211</strong></button>
                </div> 
                <div class="three-row-buttons">
                    <button class="remote-buttons" id="VolumeMute">&#128266;</button>
                    <button class="remote-buttons" id="VolumeDown">&#128265;</button>
                    <button class="remote-buttons" id="VolumeUp">&#128266;</button>
                </div>
                <div class="two-row-buttons">
                    <button class="remote-buttons" id="Back">&#10550;</button>
                    <button class="remote-buttons" id="Home">⌂</button>
                </div>
                <div class="center-buttons">
                    <div class="empty-button"></div>
                    <button class="remote-buttons direction-buttons" id="Up">&#129121;</button>
                        <div class="empty-button"></div>
                    <button class="remote-buttons direction-buttons" id="Left">&#129120;</button>
                    <button class="remote-buttons ok-button" id="Select">OK</button>
                    <button class="remote-buttons direction-buttons" id="Right">&#129122;</button>
                        <div class="empty-button"></div>
                    <button class="remote-buttons direction-buttons" id="Down">&#129123;</button>
                    <div class="empty-button"></div>
                </div>
                <div class="three-row-buttons">
                    <button style="transform: scaleX(-1)"class="remote-buttons" id="InstantReplay">&#10227;</button>
                    <button class="remote-buttons" id="Sleep">&#127769;</button>
                    <button class="remote-buttons" id="Info">&#9881;</button>
                    <button class="remote-buttons" id="Rev">&#9194;</button>
                    <button class="remote-buttons" id="Play">&#9654;</button>
                    <button class="remote-buttons" id="Fwd">&#9193;</button>
                </div>
                <div class="keyboard-row">
                    <input id="keyboard-input" type="text" placeholder="Type here...">
                    <button id="keyboard-clear">&#128465;</button>
                </div>
            </div>
            <div class="pane">
                <h2>Device Scanner</h2>
                <div id="scan-results"></div>
                <input id="subnet-start" type="text" placeholder="Subnet start (e.g. 192.168.0)">
                <span>.</span>
                <input id="low-ip" type="number" placeholder="Low IP (e.g. 1)" min="0" max="255">
                <span>-</span>
                <input id="high-ip" type="number" placeholder="High IP (e.g. 254)" min="0" max="255">
                <button id="scan-button">Scan for devices</button>
            </div>
        </main>
        <footer>
            <p>Icons by <a href="https://www.icons8.com/">Icons8</a></p>
        </footer>
    </body>

</html>
