<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>Home Control</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="icon" href="assets/images/remote-controller-icon.png">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="remote">
            <div class="power-buttons">
                <button class="remote-buttons power-button" id="poweron" style="background-color: #06822b;"><strong>&#9211</strong></button>
                <button class="remote-buttons power-button" id="poweroff" style="background-color: #d90429;"><strong>&#9211</strong></button>
            </div>
            <div class="volume-buttons">
                <button class="remote-buttons" id="volumedown">Volume Down</button>
                <button class="remote-buttons" id="volumeup">Volume Up</button>
            </div>
            <div class="home-back-buttons">
                <button class="remote-buttons" id="back">Back</button>
                <button class="remote-buttons" id="home">Home</button>
            </div>  
            <div class="center-buttons">
                <div class="up-button">
                    <button class="remote-buttons" id="up">Up</button>
                </div>  
                <button class="remote-buttons" id="left">&leftarrow;</button>
                <button class="remote-buttons" id="select">Select</button>
                <button class="remote-buttons" id="right">Right</button>
                <div class="down-button">
                    <button class="remote-buttons" id="down">Down</button>
                </div>
            </div>
            <button class="remote-buttons" id="Lit_a">a</button>
        </div>
    </body>
</html>
